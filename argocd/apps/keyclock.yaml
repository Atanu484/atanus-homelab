apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keycloak
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.bitnami.com/bitnami
    chart: keycloak
    targetRevision: 22.2.1
    helm:
      releaseName: keycloak
      values: |
        # --- Admin user ---
        auth:
          adminUser: admin
          adminPassword: "CHANGE-ME-STRONG-PASSWORD"

        # --- Service exposure (match your Grafana style) ---
        service:
          type: NodePort
          nodePorts:
            http: 30990

        replicaCount: 1

      
        proxy: edge
        postgresql:
          enabled: true
          auth:
            username: bn_keycloak
            password: "CHANGE-ME-DB-PASSWORD"
            database: bitnami_keycloak
          primary:
            persistence:
              enabled: true
              storageClass: longhorn
              size: 10Gi
            # (optional) helps avoid node-hopping in small clusters
            # podAntiAffinityPreset: soft

  destination:
    server: https://kubernetes.default.svc
    namespace: iam
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true