apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homarr
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://homarr-labs.github.io/charts/
    chart: homarr
    targetRevision: 8.9.1
    helm:
      releaseName: homarr
      values: |
        env:
          TZ: "Europe/Tallinn"

        service:
          main:
            type: NodePort
            nodePort: 31040

        persistence:
          homarrDatabase:
            enabled: true
            storageClassName: longhorn
            size: 1Gi

  destination:
    server: https://kubernetes.default.svc
    namespace: homarr
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

---
apiVersion: v1
kind: Secret
metadata:
  name: db-encryption
  namespace: homarr
type: Opaque
stringData:
  db-encryption-key: "CHANGE_ME_TO_A_LONG_RANDOM_STRING"