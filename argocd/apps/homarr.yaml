apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homarr
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://homarr-labs.github.io/charts/
    chart: homarr
    targetRevision: 8.13.0
    helm:
      releaseName: homarr
      values: |
        replicaCount: 1
        strategyType: Recreate

        env:
          TZ: "Europe/Tallinn"

        service:
          type: NodePort
          ports:
            app:
              nodePort: 31045

        persistence:
          homarrDatabase:
            enabled: true
            storageClassName: longhorn
            size: 1Gi

        # Give internal Redis and app time to start
        livenessProbe:
          initialDelaySeconds: 45
        readinessProbe:
          initialDelaySeconds: 45

        # Use existing secret for DB encryption (required; key must be 64-char hex)
        envSecrets:
          dbEncryption:
            existingSecret: db-encryption
            key: db-encryption-key

  destination:
    server: https://kubernetes.default.svc
    namespace: homarr
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

---
apiVersion: v1
kind: Secret
metadata:
  name: db-encryption
  namespace: homarr
type: Opaque
stringData:
  # Must be 64-char hex (e.g. openssl rand -hex 32). Change breaks existing encrypted DB.
  db-encryption-key: "4d3b0a81aa5df20b67924fadaf6759a62143f561c058a050b2f03c40b07234da"

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: homarr
  namespace: homarr
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: homarr.atanuslab.xyz
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: homarr
                port:
                  number: 7575
