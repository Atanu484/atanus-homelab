apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homarr
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://bjw-s.github.io/helm-charts
    chart: app-template
    targetRevision: 3.5.1
    helm:
      releaseName: homarr
      values: |
        controllers:
          main:
            containers:
              main:
                image:
                  repository: homarrteam/homarr
                  tag: latest
                env:
                  TZ: Europe/Tallinn
                ports:
                  - name: http
                    containerPort: 7575

        service:
          main:
            type: NodePort
            ports:
              http:
                port: 7575
                nodePort: 31040

        persistence:
          data:
            enabled: true
            type: pvc
            storageClass: longhorn
            accessMode: ReadWriteOnce
            size: 5Gi
            mountPath: /app/data

        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          fsGroup: 1000

  destination:
    server: https://kubernetes.default.svc
    namespace: homarr
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true