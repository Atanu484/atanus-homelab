# Created first so renovate-sealed-secret can be applied by root-app (sync wave -1).
# The renovate Application also uses CreateNamespace=true for its destination.
apiVersion: v1
kind: Namespace
metadata:
  name: renovate
  labels:
    app.kubernetes.io/name: renovate
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
