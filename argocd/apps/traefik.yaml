apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://traefik.github.io/charts
    chart: traefik
    targetRevision: 39.0.2
    helm:
      releaseName: traefik
      values: |
        service:
          type: NodePort
          spec:
            externalTrafficPolicy: Local

        # Enable the dashboard route (GUI)
        ingressRoute:
          dashboard:
            enabled: true

        # Expose ports via NodePort
        ports:
          web:
            port: 8000
            expose: true
            exposedPort: 80
            protocol: TCP
            nodePort: 30080

          websecure:
            port: 8443
            expose: true
            exposedPort: 443
            protocol: TCP
            nodePort: 30443

          traefik:
            port: 9000
            expose: true
            exposedPort: 9000
            protocol: TCP
            nodePort: 30901

        additionalArguments:
          - "--api.dashboard=true"
          - "--providers.kubernetescrd=true"
          - "--providers.kubernetesingress=true"

  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true