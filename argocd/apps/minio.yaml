apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: minio
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.min.io
    chart: minio
    targetRevision: 5.4.0
    helm:
      releaseName: minio
      values: |
        mode: standalone
        replicas: 1

        deploymentUpdate:
          type: RollingUpdate
          maxUnavailable: 1
          maxSurge: 0

        rootUser: minioadmin
        rootPassword: minioadmin123

        resources:
          requests:
            memory: 256Mi
            cpu: 100m
          limits:
            memory: 1Gi

        persistence:
          enabled: true
          size: 5Gi
          accessMode: ReadWriteOnce
          storageClass: longhorn

        service:
          type: NodePort
          nodePort: 30950

        consoleService:
          type: NodePort
          nodePort: 30951

  destination:
    server: https://kubernetes.default.svc
    namespace: storage

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: minio-console
  namespace: storage
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: minio.atanuslab.xyz
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: minio-console
                port:
                  number: 9001
