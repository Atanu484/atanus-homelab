# Argo CD self-management: this Application deploys Argo CD from the official Helm chart.
# All config that was previously manual is now in Git here so it is not lost on sync.
# Repo credentials (private repos) stay in-cluster Secrets; use Sealed Secrets or document locally.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://argoproj.github.io/argo-helm
      chart: argo-cd
      targetRevision: 9.4.10
      helm:
        releaseName: argocd
        values: |
          server:
            replicaCount: 1
            service:
              type: NodePort
              nodePortHttp: 30110
              nodePortHttps: 30111
          repoServer:
            replicaCount: 1
          controller:
            replicaCount: 1

          # Redis: use Redis HA with Longhorn persistence (like rest of apps)
          redis-ha:
            enabled: true
            replicas: 1
            persistentVolume:
              enabled: true
              storageClass: longhorn
              size: 2Gi
            redis:
              config:
                min-replicas-to-write: 0

          # --- Exported from your manual config (GitOps source of truth) ---
          configs:
            cm:
              url: "https://argocd.example.com"
              admin.enabled: "true"
              application.instanceLabelKey: argocd.argoproj.io/instance
              application.sync.impersonation.enabled: "false"
              exec.enabled: "false"
              statusbadge.enabled: "false"
              timeout.reconciliation: 120s
              timeout.reconciliation.jitter: 60s
              timeout.hard.reconciliation: 0s
              resource.customizations.ignoreResourceUpdates.all: |
                jsonPointers:
                - /status
              resource.customizations.ignoreResourceUpdates.argoproj.io_Application: |
                jqPathExpressions:
                - '.metadata.annotations."notified.notifications.argoproj.io"'
                - '.metadata.annotations."argocd.argoproj.io/refresh"'
                - '.metadata.annotations."argocd.argoproj.io/hydrate"'
                - '.operation'
              resource.customizations.ignoreResourceUpdates.argoproj.io_Rollout: |
                jqPathExpressions:
                - '.metadata.annotations."notified.notifications.argoproj.io"'
              resource.customizations.ignoreResourceUpdates.autoscaling_HorizontalPodAutoscaler: |
                jqPathExpressions:
                - '.metadata.annotations."autoscaling.alpha.kubernetes.io/behavior"'
                - '.metadata.annotations."autoscaling.alpha.kubernetes.io/conditions"'
                - '.metadata.annotations."autoscaling.alpha.kubernetes.io/metrics"'
                - '.metadata.annotations."autoscaling.alpha.kubernetes.io/current-metrics"'
              resource.customizations.ignoreResourceUpdates.ConfigMap: |
                jqPathExpressions:
                - '.metadata.annotations."cluster-autoscaler.kubernetes.io/last-updated"'
                - '.metadata.annotations."control-plane.alpha.kubernetes.io/leader"'
              resource.customizations.ignoreResourceUpdates.apps_ReplicaSet: |
                jqPathExpressions:
                - '.metadata.annotations."deployment.kubernetes.io/desired-replicas"'
                - '.metadata.annotations."deployment.kubernetes.io/max-replicas"'
                - '.metadata.annotations."rollout.argoproj.io/desired-replicas"'
              resource.customizations.ignoreResourceUpdates.discovery.k8s.io_EndpointSlice: |
                jsonPointers:
                - /metadata
                - /endpoints
                - /ports
              resource.customizations.ignoreResourceUpdates.Endpoints: |
                jsonPointers:
                - /metadata
                - /subsets
              resource.exclusions: |
                - apiGroups:
                  - ''
                  - discovery.k8s.io
                  kinds:
                  - Endpoints
                  - EndpointSlice
                - apiGroups:
                  - coordination.k8s.io
                  kinds:
                  - Lease
                - apiGroups:
                  - authentication.k8s.io
                  - authorization.k8s.io
                  kinds:
                  - SelfSubjectReview
                  - TokenReview
                  - LocalSubjectAccessReview
                  - SelfSubjectAccessReview
                  - SelfSubjectRulesReview
                  - SubjectAccessReview
                - apiGroups:
                  - certificates.k8s.io
                  kinds:
                  - CertificateSigningRequest
                - apiGroups:
                  - cert-manager.io
                  kinds:
                  - CertificateRequest
                - apiGroups:
                  - cilium.io
                  kinds:
                  - CiliumIdentity
                  - CiliumEndpoint
                  - CiliumEndpointSlice
                - apiGroups:
                  - kyverno.io
                  - reports.kyverno.io
                  - wgpolicyk8s.io
                  kinds:
                  - PolicyReport
                  - ClusterPolicyReport
                  - EphemeralReport
                  - ClusterEphemeralReport
                  - AdmissionReport
                  - ClusterAdmissionReport
                  - BackgroundScanReport
                  - ClusterBackgroundScanReport
                  - UpdateRequest
            params:
              applicationsetcontroller.enable.leader.election: "false"
            rbac:
              create: true
              policy.default: ""
              policy.csv: ""
              policy.matchMode: glob
              scopes: '[groups]'
    - repoURL: https://github.com/Atanu484/atanus-homelab.git
      targetRevision: master
      path: argocd/apps/argocd
      directory:
        exclude: 'application.yaml'
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
