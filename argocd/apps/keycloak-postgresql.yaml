# PostgreSQL for Keycloak (Bitnami). Deploy before Keycloak.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keycloak-postgresql
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.bitnami.com/bitnami
    chart: postgresql
    targetRevision: "15.5.0"
    helm:
      releaseName: keycloak-db
      values: |
        auth:
          username: keycloak
          password: "CHANGE-ME-DB-PASSWORD"
          database: keycloak

        primary:
          persistence:
            enabled: true
            storageClass: longhorn
            size: 3Gi

        image:
          tag: "16.4.0-debian-12-r8"
  destination:
    server: https://kubernetes.default.svc
    namespace: iam
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
