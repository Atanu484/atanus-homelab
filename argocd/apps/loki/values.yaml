deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1

  limits_config:
    allow_structured_metadata: false

  schemaConfig:
    configs:
      - from: "2020-01-01"
        store: boltdb-shipper
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

  storage:
    type: filesystem

  storage_config:
    boltdb_shipper:
      active_index_directory: /var/loki/index
      cache_location: /var/loki/cache
    filesystem:
      directory: /var/loki/chunks

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    storageClass: longhorn
    size: 15Gi

simpleScalable:
  read:
    replicas: 0
  write:
    replicas: 0
  backend:
    replicas: 0

read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

gateway:
  service:
    type: NodePort
    nodePort: 31210
