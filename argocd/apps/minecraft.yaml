apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: minecraft
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://itzg.github.io/minecraft-server-charts/
    chart: minecraft
    targetRevision: 5.1.2
    helm:
      releaseName: minecraft
      values: |
        minecraftServer:
          eula: "TRUE"
          version: "LATEST"
          type: VANILLA
          difficulty: easy
          gameMode: survival
          motd: "Atanu's Homelab - Welcome!"
          maxPlayers: 10
          onlineMode: false
          pvp: false
          viewDistance: 10
          spawnProtection: 0
          serviceType: NodePort
          nodePort: 30565

        resources:
          requests:
            memory: 1Gi
            cpu: 500m
          limits:
            memory: 2Gi
            cpu: 2000m

        persistence:
          storageClass: longhorn
          dataDir:
            enabled: true
            Size: 10Gi
  destination:
    server: https://kubernetes.default.svc
    namespace: minecraft
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
