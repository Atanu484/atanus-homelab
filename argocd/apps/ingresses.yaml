# All Ingress resources for atanuslab.xyz
# Traefik handles routing based on the Host header.
# Cloudflare Tunnel forwards *.atanuslab.xyz → traefik.traefik.svc.cluster.local:80
#
# To verify actual service names in your cluster:
#   kubectl get svc -A | grep -v kube-system

---
# ArgoCD
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd
  namespace: argocd
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: argocd.atanuslab.xyz
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port:
                  number: 80

