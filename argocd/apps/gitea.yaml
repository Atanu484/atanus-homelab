apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitea
  namespace: argocd
  annotations:
    argocd.argoproj.io/tracking-id: root-app:argoproj.io/Application:argocd/gitea
spec:
  project: default
  source:
    repoURL: https://dl.gitea.com/charts/
    chart: gitea
    targetRevision: 12.5.0
    helm:
      releaseName: gitea
      values: |
        replicaCount: 1

        service:
          http:
            type: NodePort
            nodePort: 31080
          ssh:
            type: NodePort
            nodePort: 30222

        persistence:
          enabled: true
          storageClass: longhorn
          accessModes:
            - ReadWriteOnce
          size: 10Gi

        # Disable HA postgres
        postgresql-ha:
          enabled: false

        # Postgres: use bitnamilegacy image with a known-good tag (chart default may not pull)
        postgresql:
          enabled: true
          image:
            registry: docker.io
            repository: bitnamilegacy/postgresql
            tag: "16.6.0"
          persistence:
            enabled: true
            storageClass: longhorn
            size: 10Gi

        # Disable valkey-cluster for single-pod; use in-memory cache/session/level queue
        valkey-cluster:
          enabled: false

        gitea:
          admin:
            username: admin
            password: "CHANGE-ME-TO-A-STRONG-PASSWORD"
            email: admin@example.com

          config:
            database:
              DB_TYPE: postgres
              HOST: gitea-postgresql:5432
              NAME: gitea
              USER: gitea
              # Leave password handling to the chart wiring (it uses the postgresql secret)
              # Do NOT hardcode unless you know you want to.
            cache:
              ADAPTER: memory
            session:
              PROVIDER: memory
            queue:
              TYPE: level

  destination:
    server: https://kubernetes.default.svc
    namespace: gitea
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true