image:
  repository: vaultwarden/server
  tag: latest

domain: "https://vault.atanuslab.xyz"

service:
  type: ClusterIP

storage:
  enabled: true
  size: 2Gi
  class: longhorn
  dataDir: /data

extraObjects:
  - apiVersion: v1
    kind: Service
    metadata:
      name: vaultwarden-nodeport
      namespace: productivity
      labels:
        app.kubernetes.io/name: vaultwarden
        app.kubernetes.io/instance: vaultwarden
        app.kubernetes.io/component: vaultwarden
    spec:
      type: NodePort
      selector:
        app.kubernetes.io/name: vaultwarden
        app.kubernetes.io/instance: vaultwarden
        app.kubernetes.io/component: vaultwarden
      ports:
        - name: http
          port: 80
          targetPort: 8080
          nodePort: 32080
          protocol: TCP
