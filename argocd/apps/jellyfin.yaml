apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jellyfin
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://jellyfin.github.io/jellyfin-helm
    chart: jellyfin
    targetRevision: 2.7.0
    helm:
      releaseName: jellyfin
      values: |
        image:
          repository: docker.io/jellyfin/jellyfin
          tag: "10.9.11"
          pullPolicy: IfNotPresent

        deploymentStrategy:
          type: Recreate

        service:
          type: NodePort
          port: 8096
          nodePort: 31050

        # Official image works with fsGroup only; runAsUser/runAsGroup break LinuxServer init
        podSecurityContext:
          fsGroup: 1000
        securityContext: {}

        jellyfin:
          env:
            - name: TZ
              value: "Europe/Tallinn"

        persistence:
          config:
            enabled: true
            size: 1Gi
            storageClass: longhorn
            accessMode: ReadWriteOnce
          media:
            enabled: true
            type: pvc
            size: 3Gi
            storageClass: longhorn
            accessMode: ReadWriteOnce

        resources:
          requests:
            memory: 256Mi
            cpu: 100m
          limits:
            memory: 1Gi
            cpu: 2000m
  destination:
    server: https://kubernetes.default.svc
    namespace: media
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jellyfin
  namespace: media
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: jellyfin.atanuslab.xyz
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jellyfin
                port:
                  number: 8096
