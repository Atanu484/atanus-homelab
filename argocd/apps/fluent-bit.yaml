apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fluent-bit
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://fluent.github.io/helm-charts
    chart: fluent-bit
    targetRevision: 0.56.0
    helm:
      releaseName: fluent-bit
      values: |
        kind: DaemonSet

        # Tolerate all taints so Fluent Bit runs on every node (including control plane)
        tolerations:
          - operator: Exists

        rbac:
          create: true
          eventsAccess: true

        serviceAccount:
          create: true

        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi

        # Host path volumes for log collection (Talos Linux / containerd)
        daemonSetVolumes:
          - name: varlog
            hostPath:
              path: /var/log
          - name: etcmachineid
            hostPath:
              path: /etc/machine-id
              type: File

        daemonSetVolumeMounts:
          - name: varlog
            mountPath: /var/log
          - name: etcmachineid
            mountPath: /etc/machine-id
            readOnly: true

        config:
          service: |
            [SERVICE]
                Daemon       Off
                Flush        5
                Log_Level    info
                Parsers_File /fluent-bit/etc/parsers.conf
                Parsers_File /fluent-bit/etc/conf/custom_parsers.conf
                HTTP_Server  On
                HTTP_Listen  0.0.0.0
                HTTP_Port    2020
                Health_Check On

          inputs: |
            [INPUT]
                Name              tail
                Path              /var/log/containers/*.log
                multiline.parser  cri
                Tag               kube.*
                Mem_Buf_Limit     50MB
                Skip_Long_Lines   On
                Refresh_Interval  10
                DB                /var/log/flb-kube.db

            [INPUT]
                Name              systemd
                Tag               host.*
                Systemd_Filter    _SYSTEMD_UNIT=kubelet.service
                Read_From_Tail    On
                DB                /var/log/flb-systemd.db

          filters: |
            [FILTER]
                Name                kubernetes
                Match               kube.*
                Kube_URL            https://kubernetes.default.svc:443
                Kube_CA_File        /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                Kube_Token_File     /var/run/secrets/kubernetes.io/serviceaccount/token
                Merge_Log           On
                Keep_Log            Off
                K8S-Logging.Parser  On
                K8S-Logging.Exclude On
                Annotations         Off
                Labels              On

            [FILTER]
                Name   modify
                Match  kube.*
                Add    cluster homelab

            [FILTER]
                Name   modify
                Match  host.*
                Add    cluster homelab

          outputs: |
            [OUTPUT]
                Name                   loki
                Match                  kube.*
                Host                   loki-gateway.monitoring.svc.cluster.local
                Port                   80
                Labels                 {job="fluentbit", cluster="homelab"}
                Auto_Kubernetes_Labels On
                Line_Format            json
                Remove_Keys            stream

            [OUTPUT]
                Name        loki
                Match       host.*
                Host        loki-gateway.monitoring.svc.cluster.local
                Port        80
                Labels      {job="fluentbit", cluster="homelab", log_type="host"}
                Line_Format json

  destination:
    server: https://kubernetes.default.svc
    namespace: logging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: privileged
        pod-security.kubernetes.io/warn: privileged
        pod-security.kubernetes.io/audit: privileged
    syncOptions:
      - CreateNamespace=true
