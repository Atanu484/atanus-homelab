replicaCount: 1
strategyType: Recreate

env:
  TZ: "Europe/Tallinn"

service:
  type: NodePort
  ports:
    app:
      nodePort: 31045

persistence:
  homarrDatabase:
    enabled: true
    storageClassName: longhorn
    size: 1Gi

# Give internal Redis and app time to start
livenessProbe:
  initialDelaySeconds: 45
readinessProbe:
  initialDelaySeconds: 45

# Use existing secret for DB encryption (required; key must be 64-char hex)
envSecrets:
  dbEncryption:
    existingSecret: db-encryption
    key: db-encryption-key
