apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vaultwarden
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://guerzon.github.io/vaultwarden
    chart: vaultwarden
    targetRevision: 0.35.1
    helm:
      releaseName: vaultwarden
      values: |
        image:
          repository: vaultwarden/server
          tag: latest

        domain: "https://vault.atanuslab.xyz"

        service:
          type: ClusterIP

        storage:
          enabled: true
          size: 2Gi
          class: longhorn
          dataDir: /data

        extraObjects:
          - apiVersion: v1
            kind: Service
            metadata:
              name: vaultwarden-nodeport
              namespace: productivity
              labels:
                app.kubernetes.io/name: vaultwarden
                app.kubernetes.io/instance: vaultwarden
                app.kubernetes.io/component: vaultwarden
            spec:
              type: NodePort
              selector:
                app.kubernetes.io/name: vaultwarden
                app.kubernetes.io/instance: vaultwarden
                app.kubernetes.io/component: vaultwarden
              ports:
                - name: http
                  port: 80
                  targetPort: 8080
                  nodePort: 32080
                  protocol: TCP
  destination:
    server: https://kubernetes.default.svc
    namespace: productivity
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vaultwarden
  namespace: productivity
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: vault.atanuslab.xyz
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vaultwarden
                port:
                  number: 80
