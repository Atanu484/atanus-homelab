image:
  repository: docker.io/jellyfin/jellyfin
  tag: "10.11.8"
  pullPolicy: IfNotPresent

deploymentStrategy:
  type: Recreate

service:
  type: NodePort
  port: 8096
  nodePort: 31050

# Official image works with fsGroup only; runAsUser/runAsGroup break LinuxServer init
podSecurityContext:
  fsGroup: 1000
securityContext: {}

jellyfin:
  env:
    - name: TZ
      value: "Europe/Tallinn"

persistence:
  config:
    enabled: true
    size: 1Gi
    storageClass: longhorn
    accessMode: ReadWriteOnce
  media:
    enabled: true
    type: pvc
    size: 3Gi
    storageClass: longhorn
    accessMode: ReadWriteOnce

resources:
  requests:
    memory: 256Mi
    cpu: 100m
  limits:
    memory: 1Gi
    cpu: 2000m
