apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: opensearch
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://opensearch-project.github.io/helm-charts
    chart: opensearch
    targetRevision: 3.5.0
    helm:
      releaseName: opensearch
      values: |
        tolerations:
          - operator: "Exists"
            effect: "NoSchedule"
          - operator: "Exists"
            effect: "NoExecute"

        singleNode: true
        replicas: 1

        protocol: http

        # Disable security plugin for simplicity
        config:
          opensearch.yml: |
            cluster.name: opensearch-cluster
            network.host: 0.0.0.0
            discovery.type: single-node
            plugins.security.disabled: true

        opensearchJavaOpts: "-Xms256m -Xmx1024m"

        resources:
          requests:
            cpu: "100m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "2Gi"

        persistence:
          enabled: true
          storageClass: longhorn
          accessModes:
            - ReadWriteOnce
          size: 10Gi
        
        extraEnvs:
          - name: OPENSEARCH_INITIAL_ADMIN_PASSWORD
            value: "ChangeM3!Str0ngP@ssw0rd"

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true