apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homelab-showcase
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Atanu484/atanus-homelab.git
    targetRevision: master
    path: argocd/apps/homelab-showcase
    directory:
      exclude: 'application.yaml'
  destination:
    server: https://kubernetes.default.svc
    namespace: homelab-showcase
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
