apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: karakeep
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://karakeep-app.github.io/helm-charts/
    chart: karakeep
    targetRevision: 0.27.0
    helm:
      releaseName: karakeep
      values: |
        service:
          type: NodePort
          ports:
            web:
              nodePort: 31200
        persistence:
          data:
            enabled: true
            storageClass: longhorn
            accessMode: ReadWriteOnce
            size: 10Gi
        env:
          NEXTAUTH_SECRET: "CHANGE_ME_RANDOM_STRING"
          MEILI_MASTER_KEY: "CHANGE_ME_RANDOM_STRING"
          NEXTAUTH_URL: "http://192.168.50.148:31200"
  destination:
    server: https://kubernetes.default.svc
    namespace: productivity
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true