apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: karakeep
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://karakeep-app.github.io/helm-charts/
    chart: karakeep
    targetRevision: 0.31.0
    helm:
      releaseName: karakeep
      values: |
        applicationHost: karakeep.atanuslab.xyz
        applicationProtocol: https
        applicationSecretKey: "CHANGE_ME_RANDOM_STRING"
        meilisearchMasterKey: "CHANGE_ME_RANDOM_STRING"

        service:
          karakeep:
            controller: karakeep
            type: NodePort
            ports:
              http:
                port: 3000
                nodePort: 31200

        controllers:
          karakeep:
            statefulset:
              volumeClaimTemplates:
                - name: data
                  accessMode: ReadWriteOnce
                  size: 10Gi
                  storageClass: longhorn
                  globalMounts:
                    - path: /data
  destination:
    server: https://kubernetes.default.svc
    namespace: productivity
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: karakeep
  namespace: productivity
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: karakeep.atanuslab.xyz
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: karakeep
                port:
                  number: 3000
