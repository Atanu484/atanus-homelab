apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pmm
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://percona.github.io/percona-helm-charts
      chart: pmm
      targetRevision: 1.5.1
      helm:
        releaseName: pmm
        valueFiles:
          - $values/argocd/apps/pmm/values.yaml
    - repoURL: https://github.com/Atanu484/atanus-homelab.git
      targetRevision: master
      ref: values
      path: argocd/apps/pmm
      directory:
        exclude: '{application.yaml,values.yaml}'
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
