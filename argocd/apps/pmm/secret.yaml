# PMM admin password secret. Managed in Git so ArgoCD desired state always
# includes it (Helm chart only creates secret on first install).
# For production, replace with Sealed Secrets or External Secrets.
apiVersion: v1
kind: Secret
metadata:
  name: pmm-secret
  namespace: monitoring
  labels:
    app.kubernetes.io/component: pmm-server
    app.kubernetes.io/instance: pmm
    app.kubernetes.io/name: pmm
    app.kubernetes.io/part-of: percona-platform
type: Opaque
data:
  PMM_ADMIN_PASSWORD: Q0hBTkdFLU1FLVRPLUEtU1RST05HLVBBU1NXT1JE  # base64: CHANGE-ME-TO-A-STRONG-PASSWORD
