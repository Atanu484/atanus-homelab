controllers:
  main:
    containers:
      main:
        image:
          repository: kanboard/kanboard
          tag: latest
        ports:
          - name: http
            containerPort: 80

service:
  main:
    controller: main
    type: NodePort
    ports:
      http:
        port: 80
        nodePort: 31250

persistence:
  data:
    type: persistentVolumeClaim
    storageClass: longhorn
    accessMode: ReadWriteOnce
    size: 5Gi
    globalMounts:
      - path: /var/www/app/data
