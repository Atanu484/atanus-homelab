apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: opensearch-dashboards
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://opensearch-project.github.io/helm-charts
      chart: opensearch-dashboards
      targetRevision: 3.5.0
      helm:
        releaseName: opensearch-dashboards
        valueFiles:
          - $values/argocd/apps/opensearch-dashboard/values.yaml
    - repoURL: https://github.com/Atanu484/atanus-homelab.git
      targetRevision: master
      ref: values
      path: argocd/apps/opensearch-dashboard
      directory:
        exclude: '{application.yaml,values.yaml}'
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
