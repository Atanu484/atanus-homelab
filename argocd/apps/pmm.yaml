apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pmm
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://percona.github.io/percona-helm-charts
    chart: pmm
    targetRevision: 1.5.1
    helm:
      releaseName: pmm
      values: |
        secret:
          create: true
        pmm:
          adminPassword: "CHANGE-ME-TO-A-STRONG-PASSWORD"

          resources:
            requests:
              memory: "2Gi"
              cpu: "500m"
            limits:
              memory: "4Gi"

        probes:
          startupProbe:
            failureThreshold: 60
            periodSeconds: 15

        service:
          type: NodePort
          nodePort: 30970

        persistence:
          enabled: true
          size: 5Gi
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
