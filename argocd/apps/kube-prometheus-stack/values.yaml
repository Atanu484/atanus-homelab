grafana:
  adminPassword: "CHANGE-ME-STRONG-PASSWORD"
  service:
    type: NodePort
    nodePort: 31040
  resources:
    requests:
      memory: 128Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: 500m
prometheus:
  service:
    type: NodePort
    nodePort: 30900
  prometheusSpec:
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi
    retention: 7d
    resources:
      requests:
        memory: 512Mi
        cpu: 200m
      limits:
        memory: 2Gi
        cpu: 1000m
alertmanager:
  service:
    type: NodePort
    nodePort: 30903
