apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 82.10.2
      helm:
        releaseName: monitoring
        values: |
          grafana:
            adminPassword: "CHANGE-ME-STRONG-PASSWORD"
            service:
              type: NodePort
              nodePort: 31040
            resources:
              requests:
                memory: 128Mi
                cpu: 100m
              limits:
                memory: 512Mi
                cpu: 500m
          prometheus:
            service:
              type: NodePort
              nodePort: 30900
            prometheusSpec:
              storageSpec:
                volumeClaimTemplate:
                  spec:
                    storageClassName: longhorn
                    accessModes: ["ReadWriteOnce"]
                    resources:
                      requests:
                        storage: 20Gi
              retention: 7d
              resources:
                requests:
                  memory: 512Mi
                  cpu: 200m
                limits:
                  memory: 2Gi
                  cpu: 1000m
          alertmanager:
            service:
              type: NodePort
              nodePort: 30903
    - repoURL: https://github.com/Atanu484/atanus-homelab.git
      targetRevision: master
      path: argocd/apps/kube-prometheus-stack
      directory:
        exclude: 'application.yaml'
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
