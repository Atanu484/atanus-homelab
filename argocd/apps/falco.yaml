apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: falco
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://falcosecurity.github.io/charts
    chart: falco
    targetRevision: 8.0.1
    helm:
      releaseName: falco
      values: |
        # Modern eBPF driver: built-in probe, no init container / driver download or compile (works on Talos)
        driver:
          kind: modern_ebpf
          loader:
            enabled: false

        # Skip falcoctl artifact install/follow (avoids TLS fetch to falcosecurity.github.io; use built-in rules)
        falcoctl:
          artifact:
            install:
              enabled: false
            follow:
              enabled: false

        # Avoid loading config.d (duplicate container plugin); main falco.yaml has container plugin from collectors
        falco:
          config_files: []

        falcosidekick:
          enabled: true
          webui:
            enabled: true
            user: "admin:CHANGE-ME-STRONG-PASSWORD"
            service:
              type: NodePort
              nodePort: 31020
  destination:
    server: https://kubernetes.default.svc
    namespace: falco
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    # Instructs ArgoCD to label the namespace on creation to bypass PSA baseline
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: privileged
