apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: falco
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://falcosecurity.github.io/charts
    chart: falco
    targetRevision: 8.0.1
    helm:
      releaseName: falco
      values: |
        driver:
          kind: modern_ebpf
          loader:
            enabled: false

        falcoctl:
          artifact:
            install:
              enabled: false
            follow:
              enabled: false

        falco:
          config_files: []

        falcosidekick:
          enabled: true
          webui:
            enabled: true
            user: "admin:CHANGE-ME-STRONG-PASSWORD"
            service:
              type: NodePort
              nodePort: 31020
  destination:
    server: https://kubernetes.default.svc
    namespace: falco
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: privileged
