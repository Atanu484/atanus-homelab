apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitea
  namespace: argocd
  annotations:
    argocd.argoproj.io/tracking-id: root-app:argoproj.io/Application:argocd/gitea
spec:
  project: default
  sources:
    - repoURL: https://dl.gitea.com/charts/
      chart: gitea
      targetRevision: 12.5.0
      helm:
        releaseName: gitea
        values: |
          replicaCount: 1

          service:
            http:
              type: NodePort
              nodePort: 31080
            ssh:
              type: NodePort
              nodePort: 30222

          persistence:
            enabled: true
            storageClass: longhorn
            accessModes:
              - ReadWriteOnce
            size: 10Gi

          postgresql-ha:
            enabled: false

          postgresql:
            enabled: true
            image:
              registry: docker.io
              repository: bitnamilegacy/postgresql
              tag: "16.6.0"
            persistence:
              enabled: true
              storageClass: longhorn
              size: 10Gi

          valkey-cluster:
            enabled: false

          gitea:
            admin:
              username: admin
              password: "CHANGE-ME-TO-A-STRONG-PASSWORD"
              email: admin@example.com

            config:
              database:
                DB_TYPE: postgres
                HOST: gitea-postgresql:5432
                NAME: gitea
                USER: gitea
              cache:
                ADAPTER: memory
              session:
                PROVIDER: memory
              queue:
                TYPE: level
    - repoURL: https://github.com/Atanu484/atanus-homelab.git
      targetRevision: master
      path: argocd/apps/gitea
      directory:
        exclude: 'application.yaml'
  destination:
    server: https://kubernetes.default.svc
    namespace: gitea
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
