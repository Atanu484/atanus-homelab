applicationHost: karakeep.atanuslab.xyz
applicationProtocol: https
applicationSecretKey: "CHANGE_ME_RANDOM_STRING"
meilisearchMasterKey: "CHANGE_ME_RANDOM_STRING"

service:
  karakeep:
    controller: karakeep
    type: NodePort
    ports:
      http:
        port: 3000
        nodePort: 31200

controllers:
  karakeep:
    statefulset:
      volumeClaimTemplates:
        - name: data
          accessMode: ReadWriteOnce
          size: 10Gi
          storageClass: longhorn
          globalMounts:
            - path: /data

ingress:
  karakeep:
    className: traefik
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: web
    hosts:
      - host: karakeep.atanuslab.xyz
        paths:
          - path: /
            pathType: Prefix
            service:
              identifier: karakeep
              port: http
