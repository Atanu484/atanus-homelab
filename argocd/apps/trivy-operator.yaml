# Trivy Operator: vulnerability + config scanning for all workloads.
# Scans container images (CVEs) and Kubernetes resources (misconfig, secrets).
# Reports as CRDs: VulnerabilityReport, ConfigAuditReport, etc. — view with kubectl or a dashboard.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trivy-operator
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://aquasecurity.github.io/helm-charts
    chart: trivy-operator
    targetRevision: 0.31.0
    helm:
      releaseName: trivy-operator
      values: |
        targetNamespaces: ""   # all namespaces
        excludeNamespaces: "kube-system,trivy-system,kube-public"
        trivy:
          ignoreUnfixed: true   # only report vulnerabilities with fixes available
  destination:
    server: https://kubernetes.default.svc
    namespace: trivy-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
