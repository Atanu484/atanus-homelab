apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://charts.longhorn.io
    chart: longhorn
    targetRevision: 1.10.2
    helm:
      releaseName: longhorn
      values: |
        ingress:
          enabled: false

        service:
          ui:
            type: NodePort
            nodePort: 30808

        # Required for Argo CD / GitOps installs
        preUpgradeChecker:
          jobEnabled: false

        extraObjects:
          - apiVersion: v1
            kind: Namespace
            metadata:
              name: longhorn-system
              labels:
                pod-security.kubernetes.io/enforce: privileged
                pod-security.kubernetes.io/warn: privileged
                pod-security.kubernetes.io/audit: privileged

          - apiVersion: scheduling.k8s.io/v1
            kind: PriorityClass
            metadata:
              name: longhorn-critical
            value: 1000000000
            globalDefault: false
            description: "Priority class for Longhorn components."

  destination:
    server: https://kubernetes.default.svc
    namespace: longhorn-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
