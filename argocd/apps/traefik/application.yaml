apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://traefik.github.io/charts
      chart: traefik
      targetRevision: 39.0.5
      helm:
        releaseName: traefik
        values: |
          service:
            type: NodePort
            spec:
              externalTrafficPolicy: Cluster

          ports:
            web:
              port: 8000
              expose:
                default: true
              exposedPort: 80
              protocol: TCP
              nodePort: 31180

            websecure:
              port: 8443
              expose:
                default: true
              exposedPort: 443
              protocol: TCP
              nodePort: 31443

            traefik:
              port: 9000
              expose:
                default: true
              exposedPort: 9000
              protocol: TCP
              nodePort: 31901

          api:
            dashboard: true
            insecure: true

          additionalArguments:
            - "--providers.kubernetescrd=true"
            - "--providers.kubernetesingress=true"
            - "--providers.kubernetesCRD.allowCrossNamespace=true"
    - repoURL: https://github.com/Atanu484/atanus-homelab.git
      targetRevision: master
      path: argocd/apps/traefik
      directory:
        exclude: 'application.yaml'
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
