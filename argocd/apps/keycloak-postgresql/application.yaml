apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keycloak-postgresql
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://charts.bitnami.com/bitnami
      chart: postgresql
      targetRevision: "15.5.0"
      helm:
        releaseName: keycloak-db
        valueFiles:
          - $values/argocd/apps/keycloak-postgresql/values.yaml
    - repoURL: https://github.com/Atanu484/atanus-homelab.git
      targetRevision: master
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: iam
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
