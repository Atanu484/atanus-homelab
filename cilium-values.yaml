ipv4:
  enabled: true

ipv6:
  enabled: false

operator:
  replicas: 1

# Keep your current IPAM choice
ipam:
  mode: cluster-pool
  operator:
    clusterPoolIPv4PodCIDRList:
      - 10.244.0.0/16

# Talos uses kubeprism on localhost:7445 for in-cluster access to the apiserver
k8sServiceHost: localhost
k8sServicePort: 7445

# Talos-friendly cgroup mounting
cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup

# IMPORTANT: Explicitly set capabilities so the chart doesn't request SYS_MODULE
securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - IPC_LOCK
      - KILL
      - NET_ADMIN
      - NET_RAW
      - SETGID
      - SETUID
      - SYS_ADMIN
      - SYS_RESOURCE
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE
