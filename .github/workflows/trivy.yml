name: Trivy
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 0"
jobs:
  trivy-config:
    name: Trivy config
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Run Trivy config (table – visible in log)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: "config"
          scan-ref: "."
          format: "table"
          severity: "CRITICAL,HIGH"
          exit-code: "0"
      - name: Run Trivy config (SARIF for Security tab)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: "config"
          scan-ref: "."
          format: "sarif"
          output: "trivy-config.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: "0"
      - name: Upload Trivy config SARIF
        if: hashFiles('trivy-config.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "trivy-config.sarif"
      - name: Upload Trivy config report (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: trivy-config-report
          path: trivy-config.sarif
          if-no-files-found: ignore
      - name: Vulnerability summary (visible on run)
        run: |
          if [ -f trivy-config.sarif ]; then
            CRITICAL=$(jq '[.runs[].results[]? | select(.level == "error")] | length' trivy-config.sarif 2>/dev/null || echo 0)
            HIGH=$(jq '[.runs[].results[]? | select(.level == "warning")] | length' trivy-config.sarif 2>/dev/null || echo 0)
            TOTAL=$((CRITICAL + HIGH))
            echo "## Trivy config scan" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Severity | Count |" >> $GITHUB_STEP_SUMMARY
            echo "|----------|------:|" >> $GITHUB_STEP_SUMMARY
            echo "| Critical | $CRITICAL |" >> $GITHUB_STEP_SUMMARY
            echo "| High     | $HIGH |" >> $GITHUB_STEP_SUMMARY
            echo "| **Total** | **$TOTAL** |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "See **Security → Code scanning** for details. Download **trivy-config-report** artifact for SARIF." >> $GITHUB_STEP_SUMMARY
          else
            echo "## Trivy config scan" >> $GITHUB_STEP_SUMMARY
            echo "No SARIF file (no findings or scan skipped)." >> $GITHUB_STEP_SUMMARY
          fi
  trivy-fs:
    name: Trivy filesystem (secrets)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Run Trivy filesystem
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "table"
          severity: "CRITICAL,HIGH"
          exit-code: "0"
      - name: Run Trivy filesystem (JSON for artifact)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "json"
          output: "trivy-fs.json"
          severity: "CRITICAL,HIGH"
          exit-code: "0"
      - name: Upload Trivy fs report (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: trivy-fs-report
          path: trivy-fs.json
          if-no-files-found: ignore
      - name: Vulnerability summary (visible on run)
        if: hashFiles('trivy-fs.json') != ''
        run: |
          CRITICAL=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' trivy-fs.json 2>/dev/null || echo 0)
          HIGH=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH")] | length' trivy-fs.json 2>/dev/null || echo 0)
          SECRETS=$(jq '[.Results[]?.Secrets[]?] | length' trivy-fs.json 2>/dev/null || echo 0)
          echo "## Trivy filesystem scan" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Finding   | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|------:|" >> $GITHUB_STEP_SUMMARY
          echo "| Critical  | $CRITICAL |" >> $GITHUB_STEP_SUMMARY
          echo "| High      | $HIGH |" >> $GITHUB_STEP_SUMMARY
          echo "| Secrets   | $SECRETS |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download **trivy-fs-report** artifact for full JSON." >> $GITHUB_STEP_SUMMARY
