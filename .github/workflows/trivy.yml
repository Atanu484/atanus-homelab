# Trivy: scan Kubernetes manifests and repo for misconfigs, secrets, and (optionally) container image refs.
# Complements in-cluster Trivy Operator (argocd/apps/trivy-operator.yaml).
# Results: table in Actions log; SARIF in Security tab (enable Code scanning in repo settings if needed).
name: Trivy
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 6 * * 0"   # Weekly Sunday 06:00 UTC
jobs:
  trivy-config:
    name: Trivy config
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # for SARIF upload
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run Trivy config (table – visible in log)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: "config"
          scan-ref: "."
          format: "table"
          severity: "CRITICAL,HIGH"
          exit-code: "0"
      - name: Run Trivy config (SARIF for Security tab)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: "config"
          scan-ref: "."
          format: "sarif"
          output: "trivy-config.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: "0"
      - name: Upload Trivy config SARIF
        if: hashFiles('trivy-config.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "trivy-config.sarif"
  trivy-fs:
    name: Trivy filesystem (secrets)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run Trivy filesystem
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "table"
          severity: "CRITICAL,HIGH"
          exit-code: "0"   # set to "1" to fail the workflow on findings
