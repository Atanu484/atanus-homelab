# Self-hosted Renovate via GitHub Actions (avoids homelab network/TLS issues).
# Runs on GitHub's runners; uses repo secret RENOVATE_TOKEN (PAT with repo scope).
# Config: renovate.json at repo root.
name: Renovate
on:
  schedule:
    - cron: '0 0 * * *'   # Daily at 00:00 UTC
  workflow_dispatch:      # Run manually from Actions tab
jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Renovate
        uses: renovatebot/github-action@v46.1.4
        with:
          configurationFile: renovate.json
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
